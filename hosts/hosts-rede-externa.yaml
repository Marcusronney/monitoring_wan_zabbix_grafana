    - host: 'Internet - Resolucao DNS'
      name: 'Internet - Servidores DNS públicos'
      description: 'Testes de resolução DNS feitos pelo agente do Zabbix server.'
      groups:
        - name: 'INTERNET EXTERNA'
      interfaces:
        - interface_ref: if1
      items:
        - name: 'DNS Cloudflare 1.1.1.1: ICMP loss'
          type: SIMPLE
          key: 'icmppingloss[1.1.1.1]'
          value_type: FLOAT
          units: '%'
          interface_ref: if1
          tags:
            - tag: component
              value: icmp
        - name: 'DNS Google 8.8.8.8: ICMP loss'
          type: SIMPLE
          key: 'icmppingloss[8.8.8.8]'
          value_type: FLOAT
          units: '%'
          interface_ref: if1
          tags:
            - tag: component
              value: icmp
        - name: 'DNS Quad9 9.9.9.9: ICMP loss'
          type: SIMPLE
          key: 'icmppingloss[9.9.9.9]'
          value_type: FLOAT
          units: '%'
          interface_ref: if1
          tags:
            - tag: component
              value: icmp
        - name: 'DNS AdGuard 94.140.14.14: ICMP loss'
          type: SIMPLE
          key: 'icmppingloss[94.140.14.14]'
          value_type: FLOAT
          units: '%'
          interface_ref: if1
          tags:
            - tag: component
              value: icmp
        - name: 'DNS DNS .br (a.dns.br): ICMP loss'
          type: SIMPLE
          key: 'icmppingloss[a.dns.br]'
          value_type: FLOAT
          units: '%'
          interface_ref: if1
          tags:
            - tag: component
              value: icmp
        - name: 'DNS Cloudflare 1.1.1.1: ICMP response time'
          type: SIMPLE
          key: 'icmppingsec[1.1.1.1]'
          value_type: FLOAT
          units: s
          interface_ref: if1
          tags:
            - tag: component
              value: icmp
        - name: 'DNS Google 8.8.8.8: ICMP response time'
          type: SIMPLE
          key: 'icmppingsec[8.8.8.8]'
          value_type: FLOAT
          units: s
          interface_ref: if1
          tags:
            - tag: component
              value: icmp
        - name: 'DNS Quad9 9.9.9.9: ICMP response time'
          type: SIMPLE
          key: 'icmppingsec[9.9.9.9]'
          value_type: FLOAT
          units: s
          interface_ref: if1
          tags:
            - tag: component
              value: icmp
        - name: 'DNS AdGuard 94.140.14.14: ICMP response time'
          type: SIMPLE
          key: 'icmppingsec[94.140.14.14]'
          value_type: FLOAT
          units: s
          interface_ref: if1
          tags:
            - tag: component
              value: icmp
        - name: 'DNS DNS .br (a.dns.br): ICMP response time'
          type: SIMPLE
          key: 'icmppingsec[a.dns.br]'
          value_type: FLOAT
          units: s
          interface_ref: if1
          tags:
            - tag: component
              value: icmp
        - name: 'DNS Cloudflare 1.1.1.1: ICMP ping'
          type: SIMPLE
          key: 'icmpping[1.1.1.1]'
          interface_ref: if1
          tags:
            - tag: component
              value: icmp
        - name: 'DNS Google 8.8.8.8: ICMP ping'
          type: SIMPLE
          key: 'icmpping[8.8.8.8]'
          interface_ref: if1
          tags:
            - tag: component
              value: icmp
        - name: 'DNS Quad9 9.9.9.9: ICMP ping'
          type: SIMPLE
          key: 'icmpping[9.9.9.9]'
          interface_ref: if1
          tags:
            - tag: component
              value: icmp
        - name: 'DNS AdGuard 94.140.14.14: ICMP ping'
          type: SIMPLE
          key: 'icmpping[94.140.14.14]'
          interface_ref: if1
          tags:
            - tag: component
              value: icmp
        - name: 'DNS DNS .br (a.dns.br): ICMP ping'
          type: SIMPLE
          key: 'icmpping[a.dns.br]'
          interface_ref: if1
          tags:
            - tag: component
              value: icmp
        - name: 'DNS Cloudflare 1.1.1.1: tempo de conexão'
          type: SIMPLE
          key: 'net.tcp.service.perf[tcp,1.1.1.1,53]'
          history: 90d
          value_type: FLOAT
          units: s
          tags:
            - tag: component
              value: dns
        - name: 'DNS Google 8.8.8.8: tempo de conexão'
          type: SIMPLE
          key: 'net.tcp.service.perf[tcp,8.8.8.8,53]'
          history: 90d
          value_type: FLOAT
          units: s
          tags:
            - tag: component
              value: dns
        - name: 'DNS Quad9 9.9.9.9: tempo de conexão'
          type: SIMPLE
          key: 'net.tcp.service.perf[tcp,9.9.9.9,53]'
          history: 90d
          value_type: FLOAT
          units: s
          tags:
            - tag: component
              value: dns
        - name: 'DNS AdGuard 94.140.14.14: tempo de conexão'
          type: SIMPLE
          key: 'net.tcp.service.perf[tcp,94.140.14.14,53]'
          history: 90d
          value_type: FLOAT
          units: s
          tags:
            - tag: component
              value: dns
        - name: 'DNS DNS .br (a.dns.br): tempo de conexão'
          type: SIMPLE
          key: 'net.tcp.service.perf[tcp,a.dns.br,53]'
          history: 90d
          value_type: FLOAT
          units: s
          tags:
            - tag: component
              value: dns
        - name: 'DNS Cloudflare 1.1.1.1: porta 53 acessível'
          type: SIMPLE
          key: 'net.tcp.service[tcp,1.1.1.1,53]'
          history: 90d
          tags:
            - tag: component
              value: dns
          triggers:
            - expression: 'max(/Internet - Resolucao DNS/net.tcp.service[tcp,1.1.1.1,53],5m)=0'
              name: 'DNS Cloudflare 1.1.1.1 inacessível'
              priority: AVERAGE
        - name: 'DNS Google 8.8.8.8: porta 53 acessível'
          type: SIMPLE
          key: 'net.tcp.service[tcp,8.8.8.8,53]'
          history: 90d
          tags:
            - tag: component
              value: dns
          triggers:
            - expression: 'max(/Internet - Resolucao DNS/net.tcp.service[tcp,8.8.8.8,53],5m)=0'
              name: 'DNS Google 8.8.8.8 inacessível'
              priority: AVERAGE
        - name: 'DNS Quad9 9.9.9.9: porta 53 acessível'
          type: SIMPLE
          key: 'net.tcp.service[tcp,9.9.9.9,53]'
          history: 90d
          tags:
            - tag: component
              value: dns
          triggers:
            - expression: 'max(/Internet - Resolucao DNS/net.tcp.service[tcp,9.9.9.9,53],5m)=0'
              name: 'DNS Quad9 9.9.9.9 inacessível'
              priority: AVERAGE
        - name: 'DNS AdGuard 94.140.14.14: porta 53 acessível'
          type: SIMPLE
          key: 'net.tcp.service[tcp,94.140.14.14,53]'
          history: 90d
          tags:
            - tag: component
              value: dns
          triggers:
            - expression: 'max(/Internet - Resolucao DNS/net.tcp.service[tcp,94.140.14.14,53],5m)=0'
